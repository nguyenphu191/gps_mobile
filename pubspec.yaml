name: gpscamerastamp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  camera: ^0.11.1
  image: ^4.5.3
  path_provider: ^2.1.5
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  geocoding: ^3.0.0
  share_plus: ^10.1.4
  uuid: ^4.5.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  http: ^1.3.0
  url_launcher: ^6.3.1
  sensors_plus: ^6.1.0
  gal: ^2.3.0
  shimmer: ^2.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  easy_ads_flutter:
    path: ../easy_ads_flutter/easy_ads_flutter
  google_mobile_ads: ^6.0.0
  gma_mediation_meta: ^1.5.0
  app_tracking_transparency: ^2.0.6+1
  get_it: ^8.0.3
  webview_flutter: ^4.10.0
  video_player: ^2.9.1
  firebase_auth:
  cloud_firestore:
  firebase_messaging:
  flutter_local_notifications: ^19.4.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lang/
    - assets/auth/
    - assets/home/

dependency_overrides:
  logger: ^2.0.0
